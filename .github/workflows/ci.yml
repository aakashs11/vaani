name: Vaani checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Toolchain
        run: |
          xcode-select -p
          swift --version
      - name: Build and test
        run: make test
      - name: Package and inspect
        run: |
          bash scripts/build-app.sh release arm64
          python3 Tests/branding_check.py .build/arm64-apple-macosx/release/Vaani.app
